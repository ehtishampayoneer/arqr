<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF7F2">
<meta name="description" content="An AR catalog. Every product at true size, in your own space, before you buy.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>AR catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="i18n.js?v=48"></script>
<style>
  :root{
    --page:#FAF7F2; --page-hi:#FDFBF7; --page-alt:#F4EFE5;
    --ink:#191919; --ink-soft:#6E6A64; --line:#E4DED4;
    /* every shop paints its own page */
    --tone:#B4623A; --tone-soft:rgba(180,98,58,.12);
    --tone-lo:#C8794F; --tone-hi:#7C3F22;
    --f-head:"Archivo","Arial Black","Segoe UI",Impact,sans-serif;
    --f-body:"Inter","Segoe UI",-apple-system,Helvetica,Arial,sans-serif;
    --gutter:clamp(14px,3vw,48px);
    --wrap:min(1320px, calc(100% - 2 * var(--gutter)));
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;height:100%}
  /* A catalog is a screen, not a page. The whole thing is one viewport tall
     and the parts that can give — the product tiles — take whatever height
     is left after the fixed furniture. Nothing here scrolls except the grid,
     and that only on a screen too short to hold two rows. */
  body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-body);
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
    height:100svh;overflow:hidden;display:flex;flex-direction:column}
  img,svg{max-width:100%}
  a{color:inherit;text-decoration:none}
  button,select{font:inherit;color:inherit}

  /* ---- the only ARQR chrome, and it says what it is ---- */
  .demo{flex:none;background:#1C1A17;color:#F6F1E9;font-size:12.5px}
  .demo-in{width:var(--wrap);margin:0 auto;padding:9px 0;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .demo b{font-weight:600}
  .demo > .demo-in > a{color:#F0A87E;font-weight:600;white-space:nowrap}
  .demo a:hover{text-decoration:underline}
  .demo svg{width:14px;height:14px;display:block;color:#F0A87E;flex:none}
  .demo-in [data-lang-slot]{margin-inline-start:auto}
  /* the switcher sits on a dark bar here */
  .demo-in .lang-btn{border-color:rgba(246,241,233,.28);color:#F6F1E9}
  .demo-in .lang-btn:hover{border-color:rgba(246,241,233,.55)}

  /* ================= the two columns ================= */
  .shell{flex:1;min-height:0;width:var(--wrap);margin:0 auto;
    padding:clamp(12px,1.8vw,22px) 0 clamp(12px,1.6vw,20px);
    display:grid;grid-template-columns:minmax(0,1.34fr) minmax(300px,.86fr);
    gap:clamp(14px,1.8vw,28px);align-items:stretch;overflow:hidden}
  .col{display:flex;flex-direction:column;min-height:0}

  /* ---------------- left: the shop's products ---------------- */
  .cats{flex:none;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .cats::-webkit-scrollbar{display:none}
  .cats button{white-space:nowrap;cursor:pointer;border:1px solid var(--line);
    background:var(--page-hi);border-radius:100px;padding:11px 20px;
    font-size:14px;font-weight:500;color:var(--ink-soft);
    transition:background .2s,color .2s,border-color .2s}
  .cats button:hover{border-color:#CFC5B6;color:var(--ink)}
  .cats button[aria-selected="true"]{background:var(--tone);border-color:var(--tone);
    color:#FFF;font-weight:600}

  .tools{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin:clamp(10px,1.3vw,15px) 0 0}
  .sel{position:relative;display:inline-flex;align-items:center}
  .sel select{appearance:none;-webkit-appearance:none;cursor:pointer;
    border:1px solid var(--line);background:var(--page-hi);border-radius:12px;
    padding:11px 40px 11px 16px;font-size:13.5px;font-weight:500;color:var(--ink);
    transition:border-color .2s}
  .sel select:hover{border-color:#CFC5B6}
  .sel svg{position:absolute;inset-inline-end:14px;width:14px;height:14px;
    pointer-events:none;color:var(--ink-soft)}

  /* two rows that share whatever height is left; the tiles are sized by the
     screen rather than by a fixed picture ratio */
  .grid{flex:1;min-height:0;overflow:auto;scrollbar-width:none;
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
    grid-template-rows:repeat(2,minmax(0,1fr));
    gap:clamp(10px,1.3vw,18px);margin:clamp(11px,1.4vw,18px) 0 0;padding:0;list-style:none}
  .grid::-webkit-scrollbar{display:none}
  @media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  /* two across holds down to about a 340px phone; below that, one */
  @media(max-width:339px){.grid{grid-template-columns:minmax(0,1fr)}}

  .prod{display:flex;flex-direction:column;min-height:0;background:var(--page-hi);
    border:1px solid var(--line);border-radius:16px;overflow:hidden;
    transition:transform .3s cubic-bezier(.3,.8,.3,1),box-shadow .3s,border-color .3s}
  .prod:hover{transform:translateY(-3px);border-color:#D9D0C2;
    box-shadow:0 24px 44px -32px rgba(70,50,30,.6)}
  .shot{position:relative;flex:1;min-height:64px;display:grid;place-items:center;overflow:hidden;
    background:radial-gradient(120% 100% at 50% 0%,#FFFDFA 0%,var(--page-alt) 100%)}
  .shot svg{width:54%;height:54%;display:block;color:#A99C89}
  .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .tag{position:absolute;top:11px;inset-inline-start:11px;z-index:2;
    background:rgba(255,255,255,.94);border-radius:100px;padding:5px 11px;
    font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-soft)}

  .meta{flex:none;padding:11px 13px 0;min-width:0}
  .pname{display:block;font-size:14.5px;font-weight:600;line-height:1.35;margin:0 0 5px}
  .price{display:block;font-size:15px;font-weight:600;color:var(--tone)}
  .dims{display:block;margin-top:4px;font-size:12.5px;color:var(--ink-soft)}

  .place{display:flex;align-items:center;justify-content:center;gap:8px;
    width:calc(100% - 28px);margin:13px 14px 14px;cursor:pointer;
    background:var(--tone);color:#FFF;border:0;border-radius:11px;padding:12px 10px;
    font-size:13px;font-weight:600;text-align:center;line-height:1.35;min-height:40px;
    transition:transform .18s ease,filter .18s ease}
  .place svg{width:16px;height:16px;display:block;flex:none}
  .place:hover{filter:brightness(1.07)}
  .place:active{transform:scale(.98)}

  /* ---- pages ---- */
  .pager{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;
    margin:clamp(11px,1.4vw,16px) 0 0}
  .pager button{min-width:40px;height:40px;cursor:pointer;border:1px solid var(--line);
    background:var(--page-hi);border-radius:12px;padding:0 12px;
    font-size:14px;font-weight:600;color:var(--ink-soft);
    display:inline-flex;align-items:center;justify-content:center;
    transition:background .2s,color .2s,border-color .2s}
  .pager button:hover:not(:disabled){border-color:#CFC5B6;color:var(--ink)}
  .pager button[aria-current="true"]{background:var(--tone);border-color:var(--tone);color:#FFF}
  .pager button:disabled{opacity:.4;cursor:default}
  .pager svg{width:15px;height:15px;display:block}
  [dir="rtl"] .pager svg{transform:scaleX(-1)}

  /* ---------------- right: the shop itself ---------------- */
  /* The padding lives on the inner block, not here. An absolutely placed
     child is positioned against the padding box, so with padding on .brand
     an inset:0 photograph stopped short of the edges and left a border of
     flat colour around it. */
  .brand{position:relative;height:100%;min-height:0;
    border-radius:clamp(18px,1.8vw,24px);overflow:hidden;
    color:#FFF;display:flex;flex-direction:column;padding:0;
    background:linear-gradient(158deg,var(--tone-lo) 0%,var(--tone) 46%,var(--tone-hi) 100%);
    box-shadow:0 40px 70px -46px rgba(60,40,25,.75)}
  .brand-in{position:relative;z-index:2;flex:none;min-width:0;
    display:flex;flex-direction:column;gap:clamp(12px,1.6vh,20px);
    padding:clamp(18px,2vw,28px)}
  /* with no photograph the copy spreads over the whole panel instead */
  .brand:not(.has-photo) .brand-in{flex:1;justify-content:space-between;
    gap:clamp(18px,3vh,30px)}

  /* A photograph takes a band of its own across the top rather than sitting
     behind everything. Laying the copy over the picture meant the name and
     headline landed a third of the way down, where any wash strong enough to
     keep white text readable would have buried the photograph anyway. This
     way the picture is seen at full strength and the words sit on solid
     colour, which is also what the reference does. */
  .brand-figure{position:relative;flex:1;min-height:0;overflow:hidden}
  .brand-figure img{width:100%;height:100%;object-fit:cover;display:block}
  /* the picture melts into the colour rather than stopping on a hard line */
  .brand-figure::after{content:"";position:absolute;inset:auto 0 0;height:38%;
    background:linear-gradient(to bottom,rgba(var(--tone-hi-rgb),0) 0%,
      rgba(var(--tone-hi-rgb),.55) 62%,rgba(var(--tone-hi-rgb),1) 100%)}
  .brand.has-photo{background:linear-gradient(180deg,
    var(--tone-hi) 0%,var(--tone) 62%,var(--tone-hi) 100%)}

  .brand-id{display:flex;align-items:center;gap:13px}
  .brand-mark{flex:none;width:46px;height:46px;border-radius:13px;display:grid;
    place-items:center;background:rgba(255,255,255,.16);color:#FFF;
    backdrop-filter:blur(4px)}
  .brand-mark svg{width:56%;height:56%;display:block}
  .brand-name{font-family:var(--f-head);font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;font-size:clamp(15px,1.4vw,18px);line-height:1.1;margin:0}
  .brand-tag{display:block;margin-top:5px;font-size:12px;color:rgba(255,255,255,.78)}

  .brand-say h2{font-family:var(--f-head);font-weight:800;letter-spacing:-.022em;
    font-size:clamp(24px,2.6vw,38px);line-height:1.04;margin:0}
  .brand-say p{margin:10px 0 0;font-size:clamp(13px,.95vw,15px);line-height:1.55;
    color:rgba(255,255,255,.86);max-width:34ch}

  .brand-scan{flex:none;display:flex;align-items:center;gap:13px;
    background:rgba(255,255,255,.13);border-radius:14px;padding:11px;
    backdrop-filter:blur(6px)}
  .brand-qr{flex:none;width:clamp(66px,5.4vw,80px);height:clamp(66px,5.4vw,80px);
    background:#FFF;border-radius:11px;padding:5px}
  .brand-qr img{width:100%;height:100%;display:block}
  .brand-scan strong{display:block;font-size:12px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase}
  .brand-scan span{display:block;margin-top:5px;font-size:12.5px;
    color:rgba(255,255,255,.82);word-break:break-all}

  /* ---------------- footer ---------------- */
  .foot{flex:none;border-top:1px solid var(--line);background:var(--page-hi)}
  .foot-in{width:var(--wrap);margin:0 auto;padding:10px 0;
    display:flex;align-items:center;justify-content:space-between;gap:14px}
  .foot-by{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-soft)}
  .foot-by svg{width:19px;height:19px;display:block;color:#E0682A}
  .foot-by b{font-family:var(--f-head);font-weight:800;letter-spacing:.07em;color:var(--ink)}
  .foot-cta{flex:none;display:inline-flex;align-items:center;gap:8px;background:#E0682A;
    color:#FFF;border-radius:100px;padding:10px 18px;font-size:13.5px;font-weight:600;
    white-space:nowrap}
  .foot-cta svg{width:15px;height:15px;display:block}
  [dir="rtl"] .foot-cta svg,[dir="rtl"] .place svg{transform:scaleX(-1)}

  /* ---------------- AR sheet ---------------- */
  .ar{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:20px;
    background:rgba(24,22,19,.62);backdrop-filter:blur(6px)}
  .ar.open{display:grid}
  .ar-box{width:min(420px,100%);background:var(--page-hi);border-radius:20px;
    padding:clamp(22px,4vw,30px);text-align:center;position:relative;
    box-shadow:0 40px 90px -40px rgba(20,16,12,.8)}
  .ar-close{position:absolute;top:12px;inset-inline-end:12px;width:40px;height:40px;
    cursor:pointer;border:0;border-radius:50%;background:var(--page-alt);
    display:grid;place-items:center}
  .ar-close svg{width:15px;height:15px;display:block}
  .ar-shot{width:110px;height:110px;margin:0 auto 16px;border-radius:16px;
    background:var(--page-alt);display:grid;place-items:center;color:#A99C89}
  .ar-shot svg{width:56%;height:56%;display:block}
  .ar-box h3{font-family:var(--f-head);font-weight:800;font-size:20px;margin:0 0 6px}
  .ar-box p{margin:0;color:var(--ink-soft);font-size:14.5px;line-height:1.6}
  .ar-qr{width:150px;margin:18px auto 0;background:#FFF;border:1px solid var(--line);
    border-radius:14px;padding:8px}
  .ar-qr img{display:block;width:100%}

  /* This sits below the .brand rules on purpose. A media query adds no
     specificity, so a plain .brand further down the sheet would beat it —
     which is exactly what was happening: height:100% won and the banner
     kept its full-panel height, squeezing the tiles to nothing. */
  @media(max-width:1000px){
    .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
    .brand{order:-1}

    /* Stacked, the panel cannot keep a whole portrait — that plus six tiles
       is more than a phone screen holds. It becomes a banner instead: the
       photograph fills it, the name and headline sit over the dark end. */
    /* height comes from the grid row now, not from a guess */
    .brand-figure{position:absolute;inset:0;flex:none}
    .brand-figure::after{inset:0;height:100%;
      background:linear-gradient(180deg,rgba(var(--tone-hi-rgb),.18) 0%,
        rgba(var(--tone-hi-rgb),.58) 46%,rgba(var(--tone-hi-rgb),.95) 100%)}
    .brand-in,.brand:not(.has-photo) .brand-in{position:relative;flex:1;
      justify-content:flex-end;gap:9px;padding:14px 17px}
    .brand-say p{display:none}
    /* the code is for someone who is not holding the phone yet */
    .brand-scan{display:none}
    .brand-say h2{font-size:clamp(20px,4.4vw,27px)}
    .brand-id{gap:11px}
    .brand-mark{width:36px;height:36px;border-radius:11px}
    .brand-name{font-size:13.5px}
    .brand-tag{display:none}
  }

  /* Short screens: the words and the button give up a few pixels each so the
     picture is not left on its 64px floor. Keyed to height, because a 1280x720
     desktop is as tight vertically as a phone. */
  @media(max-height:820px){
    .meta{padding:9px 11px 0}
    .pname{font-size:13.5px;margin-bottom:3px}
    .price{font-size:13.5px}
    .dims{font-size:11.5px;margin-top:2px}
    .place{margin:9px 11px 10px;padding:10px 8px;font-size:12.5px}
    .cats button{padding:9px 16px}
    .brand-in{padding:clamp(14px,1.6vw,22px)}
  }

  /* ---------------- phone ---------------- */
  @media(max-width:700px){
    .demo-in{padding:5px 0;font-size:11px;gap:2px;line-height:1.35}
    .demo-in > svg{display:none}
    .demo > .demo-in > a{padding:13px 15px;border:1px solid rgba(240,168,126,.4);
      border-radius:100px;margin-top:2px;line-height:1}
    .demo-in [data-lang-slot]{margin-inline-start:auto}

    .brand{border-radius:15px}

    .cats{gap:7px}
    .cats button{padding:9px 15px;font-size:13px}
    .tools{margin-top:10px}
    .sel select{padding:9px 34px 9px 13px;font-size:12.5px}
    .grid{gap:9px;margin-top:10px}
    /* every pixel out of the words here goes to the picture, which is the
       part that has to carry the product */
    .meta{padding:7px 10px 0}
    .pname,.price{font-size:13px;line-height:1.3}
    .pname{margin-bottom:2px}
    .dims{font-size:11.5px;margin-top:2px;line-height:1.3}
    /* the picture may go smaller here than on a desktop; better a short
       strip than a tile whose button gets trimmed off the bottom */
    .shot{min-height:50px}
  }

  @media(max-width:760px){
    /* One row on a phone. Four tiles plus the banner in 812px left the
       picture a 54px strip, which reads as broken rather than compact.

       The tiles are also sized here rather than stretched: the picture keeps
       a 4:3 shape and the tile is as tall as its contents, so it cannot end
       up 169 wide by 398 tall. Whatever height is then left goes to the
       banner, which has a photograph to show and no fixed size it must be. */
    .grid{flex:none;grid-template-rows:auto}
    .shot{flex:none;aspect-ratio:4/3;min-height:0}
    .shell{grid-template-rows:minmax(110px,1fr) auto}
    .brand{height:auto;min-height:110px}
    .col{min-height:0}
    .place{width:calc(100% - 20px);margin:9px 10px 10px;padding:11px 8px;
      font-size:12.5px;min-height:40px}
    /* a column here would cost 60px of a screen that has none to spare */
    .foot-in{padding:6px 0;gap:10px}
    .foot-by{font-size:11.5px}
    .foot-cta{padding:9px 14px;font-size:12.5px}
  }
  /* A tablet is a touch screen at desktop width, so this is keyed to the
     absence of a mouse rather than to a breakpoint — the width rules above
     were leaving it a 19px target on anything wider than a phone. */
  @media(hover:none){
    .demo > .demo-in > a{padding:12px 15px;border:1px solid rgba(240,168,126,.4);
      border-radius:100px;line-height:1}
  }

  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<script src="sprite.js?v=48"></script>

<div class="demo">
  <div class="demo-in">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2.2 20.5 7v10L12 21.8 3.5 17V7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 8.2 15.8 10.4v4.3L12 16.9 8.2 14.7v-4.3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <span><b>Sample catalog.</b> This is one shop's own catalog, built by ARQR.</span>
    <a href="catalog">See the other three &rarr;</a>
    <span data-lang-slot></span>
  </div>
</div>

<main class="shell">

  <div class="col">
    <div class="cats" id="cats" role="tablist" aria-label="Product categories"></div>

    <div class="tools">
      <span class="sel">
        <select id="sort" aria-label="Sort by"></select>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </div>

    <ul class="grid" id="grid"></ul>
    <nav class="pager" id="pager" aria-label="Pages"></nav>
  </div>

  <aside class="brand" id="brand">
    <div class="brand-in">

    <div class="brand-id">
      <span class="brand-mark"><svg viewBox="0 0 27 24"><use id="shopMark" href="#mk-novara"></use></svg></span>
      <div>
        <h1 class="brand-name" id="shopName">Novara Living</h1>
        <span class="brand-tag" id="shopTag">Curated furniture</span>
      </div>
    </div>

    <div class="brand-say">
      <h2 id="lead">Modern pieces for every space</h2>
      <p id="sub">Sofas, tables and storage — every one to scale in your room.</p>
    </div>

    <div class="brand-scan">
      <span class="brand-qr"><img id="scanQr" src="assets/qr-novara.svg?v=48" alt=""></span>
      <div>
        <strong id="scanTitle">Scan to explore</strong>
        <span id="scanUrl"></span>
      </div>
    </div>

    </div>
  </aside>

</main>

<footer class="foot">
  <div class="foot-in">
    <span class="foot-by">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2.2 20.5 7v10L12 21.8 3.5 17V7z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 8.2 15.8 10.4v4.3L12 16.9 8.2 14.7v-4.3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <span class="foot-txt">AR catalog by <b>ARQR</b></span>
    </span>
    <a class="foot-cta" href="/#contact">Apply for your own catalog
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h13m0 0-5.5-5.5M18 12l-5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</footer>

<div class="ar" id="ar" role="dialog" aria-modal="true" aria-labelledby="arTitle">
  <div class="ar-box">
    <button class="ar-close" id="arClose" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <div class="ar-shot"><svg viewBox="0 0 48 48"><use id="arIcon" href="#ic-sofa"></use></svg></div>
    <h3 id="arTitle"></h3>
    <p id="arText"></p>
    <div class="ar-qr" id="arQr"><img id="arQrImg" src="assets/qr-novara.svg?v=48" alt=""></div>
  </div>
</div>

<script src="stores.js?v=48"></script>
<script>
var V = '?v=48';
var STORES = window.ARQR_STORES;
/* Two rows always; how many across depends on the screen, so the page size
   follows the layout rather than being a fixed number that overflows. */
function perPage(){
  var cols = matchMedia('(max-width:339px)').matches ? 1
           : matchMedia('(max-width:760px)').matches ? 2 : 3;
  /* A short phone cannot hold two rows without squashing the tiles into
     something unreadable, so it shows one row and pages instead. Fewer,
     properly sized tiles beat a full grid of crushed ones. */
  var rows = matchMedia('(max-width:760px)').matches ? 1 : 2;
  return cols * rows;
}

/* Which shop is this? The address is the shop's own — /novara, /corso — and
   a rewrite serves this one file for all of them. The query and hash forms
   are only so the page can be opened straight off the filesystem. */
function pick(){
  var path = location.pathname.replace(/\/+$/,'').split('/').pop().replace(/\.html$/,'');
  var q = new URLSearchParams(location.search).get('s');
  var h = (location.hash || '').replace('#','');
  var want = q || h || path;
  for (var i = 0; i < STORES.length; i++) if (STORES[i].slug === want) return STORES[i];
  return STORES[0];
}
var shop = pick(), cat = 'All', page = 1, order = 'featured';

/* the shop list is data, so it is translated on the way in — shop and
   product names stay put, because a brand name is not a word to translate */
var t = function (x){ return window.ARQR_I18N ? ARQR_I18N.s(x) : x; };
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function num(p){ return parseFloat(String(p).replace(/[^0-9.]/g,'')) || 0; }

function mix(hex, to, amt){
  var m = hex.replace('#',''), o = to.replace('#','');
  var out = '#';
  for (var i = 0; i < 3; i++){
    var a = parseInt(m.substr(i*2,2),16), b = parseInt(o.substr(i*2,2),16);
    var v = Math.round(a + (b - a) * amt);
    out += ('0' + v.toString(16)).slice(-2);
  }
  return out;
}
function channels(hex){
  var m = hex.replace('#','');
  return parseInt(m.slice(0,2),16) + ',' + parseInt(m.slice(2,4),16) + ',' + parseInt(m.slice(4,6),16);
}
function rgba(hex, a){ return 'rgba(' + channels(hex) + ',' + a + ')'; }

/* ---------------- dress the page in the shop's identity ---------------- */
var root = document.documentElement.style;
root.setProperty('--tone', shop.tone);
root.setProperty('--tone-soft', rgba(shop.tone, .12));
root.setProperty('--tone-lo', mix(shop.tone, '#FFFFFF', .18));
root.setProperty('--tone-hi', mix(shop.tone, '#000000', .42));
root.setProperty('--tone-hi-rgb', channels(mix(shop.tone, '#000000', .42)));

document.title = shop.name + ' — AR catalog';
document.querySelector('meta[name=theme-color]').setAttribute('content', shop.tone);
document.querySelector('meta[name=description]')
  .setAttribute('content', shop.name + ' — ' + shop.tagline + '. Every product at true size, in your own space.');
document.getElementById('shopMark').setAttribute('href', '#' + shop.mark);
document.getElementById('shopName').textContent = shop.name;
document.getElementById('shopTag').textContent = t(shop.tagline);
document.getElementById('lead').textContent = t(shop.lead);
document.getElementById('sub').textContent = t(shop.sub);
document.getElementById('scanTitle').textContent = t('Scan to explore');
document.getElementById('scanUrl').textContent = (location.host || 'arqr-two.vercel.app') + '/' + shop.slug;
document.getElementById('scanQr').src = 'assets/qr-' + shop.slug + '.svg' + V;
document.getElementById('scanQr').alt = shop.name + ' catalog code';
document.getElementById('arQrImg').src = 'assets/qr-' + shop.slug + '.svg' + V;

/* A portrait photograph is optional. It is probed off to the side and only
   hung behind the panel once it has loaded, so a shop without one keeps the
   plain colour wash rather than showing a gap. Drop a file at
   assets/hero-<slug>.webp and it appears by itself. */
(function () {
  var probe = new Image();
  probe.onload = function(){
    probe.alt = '';
    var b = document.getElementById('brand');
    var fig = document.createElement('div');
    fig.className = 'brand-figure';
    fig.appendChild(probe);
    b.insertBefore(fig, b.firstChild);
    b.classList.add('has-photo');
  };
  probe.src = 'assets/hero-' + shop.slug + '.webp' + V;
})();

/* ---------------- categories ---------------- */
var catsEl = document.getElementById('cats');
catsEl.innerHTML = shop.cats.map(function(c){
  return '<button type="button" role="tab" data-cat="' + esc(c) + '" aria-selected="' +
         (c === cat) + '">' + esc(t(c)) + '</button>';
}).join('');
[].forEach.call(catsEl.children, function(b){
  b.addEventListener('click', function(){
    cat = b.dataset.cat; page = 1;
    [].forEach.call(catsEl.children, function(x){
      x.setAttribute('aria-selected', String(x.dataset.cat === cat));
    });
    render();
  });
});

/* ---------------- sort ---------------- */
var SORTS = [
  ['featured', 'Featured'],
  ['low',      'Price: low to high'],
  ['high',     'Price: high to low']
];
var sortEl = document.getElementById('sort');
sortEl.innerHTML = SORTS.map(function(s){
  return '<option value="' + s[0] + '">' + esc(t(s[1])) + '</option>';
}).join('');
sortEl.addEventListener('change', function(){ order = sortEl.value; page = 1; render(); });

/* ---------------- products ---------------- */
var gridEl = document.getElementById('grid');
var pagerEl = document.getElementById('pager');

function selection(){
  var list = shop.items.filter(function(it){ return cat === 'All' || it.c === cat; });
  if (order === 'low')  list = list.slice().sort(function(a,b){ return num(a.p) - num(b.p); });
  if (order === 'high') list = list.slice().sort(function(a,b){ return num(b.p) - num(a.p); });
  return list;
}

function render(){
  var list = selection();
  var per = perPage();
  var pages = Math.max(1, Math.ceil(list.length / per));
  if (page > pages) page = pages;
  var slice = list.slice((page - 1) * per, page * per);

  gridEl.innerHTML = slice.map(function(it){
    return '<li class="prod">' +
      '<div class="shot">' +
        (it.tag ? '<span class="tag">' + esc(t(it.tag)) + '</span>' : '') +
        '<svg viewBox="0 0 48 48"><use href="#' + it.i + '"></use></svg>' +
      '</div>' +
      '<div class="meta">' +
        '<span class="pname">' + esc(it.n) + '</span>' +
        '<span class="price">' + esc(it.p) + '</span>' +
        '<span class="dims">' + esc(it.d) + '</span>' +
      '</div>' +
      '<button class="place" type="button" data-k="' + shop.items.indexOf(it) + '">' +
        '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2.6 20.2 7v10L12 21.4 3.8 17V7z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M3.8 7 12 11.7 20.2 7M12 11.7v9.7" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>' +
        esc(t(shop.cta)) + '</button>' +
    '</li>';
  }).join('');

  [].forEach.call(gridEl.querySelectorAll('.place'), function(b){
    b.addEventListener('click', function(){ place(shop.items[+b.dataset.k]); });
  });

  /* the product photograph, which covers the line art once it loads */
  [].forEach.call(gridEl.querySelectorAll('.shot'), function(shot, k){
    var it = slice[k], probe = new Image();
    probe.onload = function(){ probe.alt = it.n; shot.appendChild(probe); };
    probe.src = 'assets/shops/' + shop.slug + '/' + it.f + '.webp' + V;
  });

  /* pages only exist when there is more than one — no decorative pagination */
  if (pages < 2){ pagerEl.innerHTML = ''; return; }
  var arrow = '<svg viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var html = '<button type="button" data-go="prev"' + (page === 1 ? ' disabled' : '') +
             ' aria-label="' + esc(t('Previous')) + '" style="transform:scaleX(-1)">' + arrow + '</button>';
  for (var i = 1; i <= pages; i++)
    html += '<button type="button" data-go="' + i + '" aria-current="' + (i === page) + '">' + i + '</button>';
  html += '<button type="button" data-go="next"' + (page === pages ? ' disabled' : '') +
          ' aria-label="' + esc(t('Next')) + '">' + arrow + '</button>';
  pagerEl.innerHTML = html;

  [].forEach.call(pagerEl.children, function(b){
    b.addEventListener('click', function(){
      var g = b.dataset.go;
      page = g === 'prev' ? page - 1 : g === 'next' ? page + 1 : +g;
      render();
      gridEl.scrollIntoView({ behavior:'smooth', block:'nearest' });
    });
  });
}

/* ---------------- launching AR ---------------- */
var arEl = document.getElementById('ar');
var ua = navigator.userAgent || '';
var isIOS = /iPad|iPhone|iPod/.test(ua) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var isAndroid = /Android/.test(ua);

function place(it){
  if (isIOS && it.usdz){
    var a = document.createElement('a');
    a.setAttribute('rel','ar'); a.href = it.usdz;
    a.appendChild(document.createElement('img'));
    document.body.appendChild(a); a.click(); a.remove();
    return;
  }
  if (isAndroid && it.glb){
    var abs = new URL(it.glb, location.href).href;
    location.href = 'intent://arvr.google.com/scene-viewer/1.0?file=' + encodeURIComponent(abs) +
      '&mode=ar_preferred&title=' + encodeURIComponent(it.n) +
      '#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;' +
      'S.browser_fallback_url=' + encodeURIComponent(location.href) + ';end;';
    return;
  }
  showSheet(it);
}

function showSheet(it){
  document.getElementById('arIcon').setAttribute('href', '#' + it.i);
  document.getElementById('arTitle').textContent = it.n;
  document.getElementById('arText').innerHTML = (isIOS || isAndroid)
    ? 'This sample has no 3D file for <strong>' + esc(it.n) + '</strong> yet. On ' +
      esc(shop.name) + "'s live catalog this button opens your camera and puts it in front of you at " +
      esc(it.d) + '.'
    : 'AR opens on a phone. Scan this code with your camera to load ' + esc(shop.name) +
      "'s catalog on your phone, then tap <strong>" + esc(t(shop.cta)) + '</strong>.';
  document.getElementById('arQr').style.display = (isIOS || isAndroid) ? 'none' : 'block';
  arEl.classList.add('open');
}
function shut(){ arEl.classList.remove('open'); }
document.getElementById('arClose').addEventListener('click', shut);
arEl.addEventListener('click', function(e){ if (e.target === arEl) shut(); });
addEventListener('keydown', function(e){ if (e.key === 'Escape') shut(); });

render();

/* turning the phone, or dragging a window wider, changes how many tiles fit */
var reflow;
addEventListener('resize', function(){
  clearTimeout(reflow);
  reflow = setTimeout(render, 150);
});
</script>
<script>ARQR_I18N.apply();</script>
</body>
</html>
