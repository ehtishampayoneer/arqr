<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ARQR360</title>
<!-- The strip iPhone's AR screen (Quick Look) shows along the bottom while the
     boot is in the room. Apple allows a custom banner page and nothing else
     on that screen, so this is where "Powered by ARQR360" lives. Kept to
     system fonts and one small image: it loads in the time the camera starts. -->
<style>
  html,body{margin:0;height:100%;background:#FFFFFF;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:#2B1D14}
  .row{display:flex;align-items:center;justify-content:space-between;height:100%;padding:0 16px;gap:12px;box-sizing:border-box}
  .name b{display:block;font-size:15px;font-weight:700;line-height:1.25}
  .name span{display:block;font-size:12.5px;color:#6F5E50;line-height:1.35}
  .by{display:flex;align-items:center;gap:7px;font-size:11px;color:#6F5E50;white-space:nowrap}
  .by img{height:26px;width:auto;display:block}
</style>
</head>
<body>
<div class="row">
  <div class="name"><b>Women's Moccasin Boots</b><span>Size 7 (Canada) · shown at true size</span></div>
  <div class="by">Powered by <img src="https://arqr360.com/assets/logo-bar.png" alt="ARQR360"></div>
</div>
</body>
</html>
