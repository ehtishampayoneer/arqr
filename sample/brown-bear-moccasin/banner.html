<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ARQR360</title>
<!-- The strip iPhone's AR screen (Quick Look) shows along the bottom while the
     boot is in the room. Apple allows a custom banner page and nothing else
     on that screen, so this is where "Powered by ARQR360" lives. Kept to
     system fonts and one small image: it loads in the time the camera starts.
     Tapping the strip opens arqr360.com (handled by the page that opened AR). -->
<style>
  html,body{margin:0;height:100%;background:#FFFFFF;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:#2B1D14}
  .row{display:flex;align-items:center;justify-content:space-between;height:100%;padding:0 16px;gap:12px;box-sizing:border-box}
  .name{min-width:0}
  .name b,.name span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .name b{font-size:14.5px;font-weight:700;line-height:1.25}
  .name span{font-size:12px;color:#6F5E50;line-height:1.4}
  .by{flex:none;display:flex;align-items:center;gap:7px;font-size:11px;color:#6F5E50;white-space:nowrap}
  .by img{height:26px;width:auto;display:block}
  .go{font-size:12px;font-weight:700;color:#E0682A;margin-left:2px}
</style>
</head>
<body>
<div class="row">
  <div class="name"><b>Moccasin Boots</b><span>Size 7 (CA) · true size</span></div>
  <div class="by">Powered by <img src="https://arqr360.com/assets/logo-bar.png" alt="ARQR360"><span class="go">Visit ›</span></div>
</div>
</body>
</html>
